[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kessel-gateway"
dynamic = ["version"]
description = "OpenAI-compatible local API for Codex and Claude Code subscriptions"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Rylan Wade" },
]
maintainers = [
    { name = "Rylan Wade" },
]
keywords = [
    "anthropic",
    "claude-code",
    "codex",
    "gateway",
    "local-api",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.141.1,<1",
    "jsonschema>=4.25,<5",
    "packaging>=26",
    "pydantic>=2.13,<3",
    "tiktoken>=0.14,<1",
    "uvicorn[standard]>=0.53,<1",
]

[project.scripts]
kessel = "kessel_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/waderylan/kessel"
Repository = "https://github.com/waderylan/kessel"
Issues = "https://github.com/waderylan/kessel/issues"
PyPI = "https://pypi.org/project/kessel-gateway/"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    "setuptools==84.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"

[tool.setuptools.packages.find]
include = ["kessel_gateway*"]

[tool.setuptools.package-data]
kessel_gateway = ["static/*", "providers/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "kessel_gateway.__version__" }
