[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kessel-local"
version = "0.1.0"
description = "OpenAI-compatible local API for Codex and Claude Code subscriptions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "jsonschema==4.25.1",
    "packaging==26.3",
    "pydantic==2.13.5",
    "tiktoken==0.14.0",
    "uvicorn[standard]==0.53.0",
]

[project.scripts]
kessel = "app.cli:main"

[project.urls]
Homepage = "https://github.com/waderylan/kessel"
Repository = "https://github.com/waderylan/kessel"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "setuptools==84.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "providers/*.txt"]
